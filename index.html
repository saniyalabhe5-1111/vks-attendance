<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VKS Attendance Management System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: #17365d;
      color: white;
      padding: 22px 40px;
    }

    .header h1 {
      font-size: 25px;
      font-weight: 600;
    }

    .header p {
      margin-top: 5px;
      font-size: 14px;
      opacity: 0.85;
    }

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 20px;
      color: #17365d;
      margin-bottom: 20px;
    }

    .upload-box {
      border: 2px dashed #9bb7d4;
      border-radius: 10px;
      padding: 35px;
      text-align: center;
      background: #f8fbff;
    }

    .upload-box p {
      margin-bottom: 15px;
      color: #555;
    }

    input[type="file"] {
      margin: 10px 0 20px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 11px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .send-btn {
      background: #17365d;
      color: white;
    }

    .send-btn:hover {
      background: #0f2947;
    }

    .add-btn {
      background: #198754;
      color: white;
      margin-bottom: 18px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }

    .success {
      display: block;
      background: #e7f7ed;
      color: #146c43;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .loading {
      display: block;
      background: #eef4ff;
      color: #17365d;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }

    th {
      background: #17365d;
      color: white;
      padding: 12px;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 11px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    tr:hover {
      background: #f8fafc;
    }

    .active {
      color: #198754;
      font-weight: 600;
    }

    .inactive {
      color: #dc3545;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 20px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>VKS Attendance Management System</h1>
    <p>Monthly Employee Attendance & Reporting</p>
  </div>

  <div class="container">

    <!-- ATTENDANCE -->
    <div class="card">

      <h2>MONTHLY ATTENDANCE</h2>

      <div class="upload-box">

        <p>
          Upload the monthly attendance Excel file
        </p>

        <input
          type="file"
          id="attendanceFile"
          accept=".xls,.xlsx"
        >

        <br>

        <button
          class="send-btn"
          onclick="sendAttendanceReport()"
        >
          SEND REPORT
        </button>

      </div>

      <div id="attendanceMessage" class="message"></div>

    </div>


    <!-- EMPLOYEE MANAGEMENT -->
    <div class="card">

      <h2>EMPLOYEE MANAGEMENT</h2>

      <button
        class="add-btn"
        onclick="addEmployee()"
      >
        + ADD EMPLOYEE
      </button>

      <div
        id="employeeMessage"
        class="message"
      >
        Loading employees...
      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>Employee ID</th>
              <th>Employee Name</th>
              <th>Email</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="employeeTableBody">

            <tr>
              <td colspan="5" class="empty">
                Loading employees...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <div class="footer">
    VKS &nbsp;|&nbsp; Attendance Management System
  </div>


  <script>

    /*
      ==============================
      WEBHOOK URLs
      ==============================
    */

    const ATTENDANCE_WEBHOOK =
      "https://traderemedies.app.n8n.cloud/webhook/25ff7283-d6a0-4cbc-b06e-9788fdde0145";

    const EMPLOYEE_WEBHOOK =
      "https://traderemedies.app.n8n.cloud/webhook/d7cb856a-50cd-4f0c-8264-0c81150b4ab5";


    /*
      ==============================
      ATTENDANCE REPORT
      ==============================
    */

    async function sendAttendanceReport() {

      const fileInput =
        document.getElementById("attendanceFile");

      const message =
        document.getElementById("attendanceMessage");

      if (!fileInput.files.length) {

        message.className = "message error";

        message.textContent =
          "Please select an Excel attendance file first.";

        return;
      }

      const file =
        fileInput.files[0];

      const formData =
        new FormData();

      formData.append("data0", file, file.name);

      message.className = "message loading";

      message.textContent =
        "Sending attendance report...";

      try {

        const response =
          await fetch(
            ATTENDANCE_WEBHOOK,
            {
              method: "POST",
              body: formData
            }
          );

        if (!response.ok) {
          throw new Error(
            "Server returned " + response.status
          );
        }

        message.className =
          "message success";

        message.textContent =
          "Attendance report sent successfully.";

        fileInput.value = "";

      } catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.textContent =
          "Unable to send attendance report.";

      }

    }


    /*
      ==============================
      LOAD EMPLOYEES
      ==============================
    */

    async function loadEmployees() {

      const tableBody =
        document.getElementById(
          "employeeTableBody"
        );

      const message =
        document.getElementById(
          "employeeMessage"
        );

      try {

        message.className =
          "message loading";

        message.textContent =
          "Loading employees...";


        const response =
          await fetch(
            EMPLOYEE_WEBHOOK,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                action: "get_employees"
              })
            }
          );


        if (!response.ok) {

          throw new Error(
            "Server returned " +
            response.status
          );

        }


        const result =
          await response.json();


        console.log(
          "Employee API response:",
          result
        );


        /*
          n8n Respond to Webhook
          returns the employee rows.
        */

        let employees = result;


        /*
          Some n8n responses can be wrapped
          inside a data/result property.
        */

        if (!Array.isArray(employees)) {

          if (Array.isArray(result.data)) {
            employees = result.data;
          }

          else if (Array.isArray(result.result)) {
            employees = result.result;
          }

          else if (
            Array.isArray(result.items)
          ) {
            employees = result.items;
          }

          else {
            throw new Error(
              "Employee data format not recognised."
            );
          }

        }


        tableBody.innerHTML = "";


        if (employees.length === 0) {

          tableBody.innerHTML = `
            <tr>
              <td colspan="5" class="empty">
                No employees found.
              </td>
            </tr>
          `;

        } else {

          employees.forEach(
            function(employee) {

              const row =
                document.createElement("tr");


              const employeeId =
                employee["Employee ID"] || "";

              const employeeName =
                employee["Employee Name"] || "";

              const email =
                employee["Email"] || "";

              const active =
                employee["Active"] || "";


              const statusClass =
                String(active).toLowerCase() === "yes"
                  ? "active"
                  : "inactive";


              row.innerHTML = `

                <td>
                  ${escapeHtml(employeeId)}
                </td>

                <td>
                  ${escapeHtml(employeeName)}
                </td>

                <td>
                  ${escapeHtml(email)}
                </td>

                <td class="${statusClass}">
                  ${escapeHtml(active)}
                </td>

                <td>
                  <button
                    onclick='editEmployee(${JSON.stringify(employee)})'
                  >
                    Edit
                  </button>
                </td>

              `;


              tableBody.appendChild(row);

            }
          );

        }


        message.style.display =
          "none";


      } catch (error) {

        console.error(
          "Employee loading error:",
          error
        );


        tableBody.innerHTML = `

          <tr>
            <td colspan="5" class="empty">
              Unable to load employees
            </td>
          </tr>

        `;


        message.className =
          "message error";

        message.textContent =
          "Unable to load employees.";

      }

    }


    /*
      ==============================
      HTML SAFETY
      ==============================
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ==============================
      ADD EMPLOYEE
      ==============================
    */

    function addEmployee() {

      alert(
        "Add Employee functionality will be connected next."
      );

    }


    /*
      ==============================
      EDIT EMPLOYEE
      ==============================
    */

    function editEmployee(employee) {

      alert(
        "Edit Employee functionality will be connected next."
      );

      console.log(
        "Employee selected:",
        employee
      );

    }


    /*
      ==============================
      LOAD EMPLOYEES WHEN PAGE OPENS
      ==============================
    */

    window.addEventListener(
      "DOMContentLoaded",
      function() {

        loadEmployees();

      }
    );

  </script>

</body>
</html>
